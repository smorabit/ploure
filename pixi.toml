[workspace]
name = "ploure"
description = "Development environment for the ploure R package (plotting utilities for single-cell data)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
r-base = "4.5.*"
# imports
r-ggplot2 = "*"
r-patchwork = "*"
r-ggrastr = "*"
r-scales = "*"
# suggests
r-seurat = "5.*"
r-seuratobject = "5.*"
r-ggrepel = "*"
r-ggbeeswarm = "*"
r-mass = "*"
r-viridis = "*"
r-cowplot = "*"
r-colorspace = "*"
# development
r-devtools = "*"
r-roxygen2 = "*"
r-testthat = "*"
r-vdiffr = "*"
r-svglite = "*"

[tasks]
document = "Rscript -e \"devtools::document()\""
test = "Rscript -e \"devtools::test()\""
check = "bash tools/check.sh"
install = "R CMD INSTALL --preclean ."
