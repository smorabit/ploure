[workspace]
name = "ploure"
description = "Development environment for the ploure R package (plotting utilities for single-cell data)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
r-base = "4.5.*"
# imports
r-ggplot2 = "*"
r-patchwork = "*"
r-ggrastr = "*"
r-scales = "*"
# suggests
r-seurat = "5.*"
r-seuratobject = "5.*"
r-ggrepel = "*"
r-ggbeeswarm = "*"
r-mass = "*"
r-viridis = "*"
r-cowplot = "*"
r-colorspace = "*"
r-metbrewer = "*"
r-rcolorbrewer = "*"
r-ggsci = "*"
r-polychrome = "*"
r-scico = "*"
# Milo objects (DAEmbeddingPlot)
bioconductor-milor = "*"
bioconductor-singlecellexperiment = "*"
r-igraph = "*"
# development
r-devtools = "*"
r-roxygen2 = "*"
r-testthat = "*"
r-vdiffr = "*"
r-svglite = "*"

[tasks]
# NatParksPalettes is not on conda-forge: install it from CRAN into the environment
install-natparks = "Rscript -e \"install.packages('NatParksPalettes', repos = 'https://cloud.r-project.org')\""
document = "Rscript -e \"devtools::document()\""
test = "Rscript -e \"devtools::test()\""
check = "bash tools/check.sh"
install = "R CMD INSTALL --preclean ."
